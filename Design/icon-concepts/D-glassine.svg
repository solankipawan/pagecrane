<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept D · "Glassine" — a frosted glass sheet over a page; the text blurs behind it. Pairs with the name Glassine. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F5FF"/>
      <stop offset="1" stop-color="#DCD6FF"/>
    </linearGradient>
    <radialGradient id="aura" cx=".8" cy=".85" r=".6">
      <stop offset="0" stop-color="#B15CFF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#B15CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6BFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9B5CFF" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="glassClip"><rect x="392" y="330" width="360" height="480" rx="50"/></clipPath>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#3A2E9A" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#aura)"/>

  <!-- the page underneath -->
  <g filter="url(#shadow)">
    <rect x="252" y="214" width="360" height="480" rx="50" fill="#fff"/>
  </g>
  <rect x="304" y="296" width="210" height="28" rx="14" fill="#4C5BFF"/>
  <rect x="304" y="364" width="256" height="28" rx="14" fill="#4C5BFF" fill-opacity=".35"/>
  <rect x="304" y="432" width="226" height="28" rx="14" fill="#4C5BFF" fill-opacity=".35"/>
  <rect x="304" y="500" width="256" height="28" rx="14" fill="#4C5BFF" fill-opacity=".35"/>
  <rect x="304" y="568" width="176" height="28" rx="14" fill="#4C5BFF" fill-opacity=".35"/>

  <!-- frosted glass on top: what's beneath shows through, blurred -->
  <g filter="url(#shadow)">
    <rect x="392" y="330" width="360" height="480" rx="50" fill="#fff" fill-opacity=".01"/>
  </g>
  <g clip-path="url(#glassClip)">
    <g filter="url(#frost)">
      <rect x="252" y="214" width="360" height="480" rx="50" fill="#fff"/>
      <rect x="304" y="364" width="256" height="28" rx="14" fill="#4C5BFF" fill-opacity=".5"/>
      <rect x="304" y="432" width="226" height="28" rx="14" fill="#4C5BFF" fill-opacity=".5"/>
      <rect x="304" y="500" width="256" height="28" rx="14" fill="#4C5BFF" fill-opacity=".5"/>
      <rect x="304" y="568" width="176" height="28" rx="14" fill="#4C5BFF" fill-opacity=".5"/>
    </g>
    <rect x="392" y="330" width="360" height="480" fill="url(#glass)"/>
    <rect x="392" y="330" width="360" height="480" fill="url(#sheen)"/>
  </g>
  <rect x="392" y="330" width="360" height="480" rx="50" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="6"/>
</svg>
