<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept C · "Stack" — three fanned sheets (merge · split · compress). Pairs with the name Sheaf. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset=".6" stop-color="#3B6CF6"/>
      <stop offset="1" stop-color="#4C5BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".1" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0B2A55" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="rotate(-18 512 760)">
    <rect x="352" y="250" width="320" height="450" rx="42" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-opacity=".55" stroke-width="7"/>
  </g>
  <g transform="rotate(-7 512 760)">
    <rect x="352" y="250" width="320" height="450" rx="42" fill="#fff" fill-opacity=".42" stroke="#fff" stroke-opacity=".7" stroke-width="7"/>
  </g>
  <g transform="rotate(6 512 760)" filter="url(#shadow)">
    <rect x="352" y="250" width="320" height="450" rx="42" fill="#fff"/>
    <rect x="402" y="330" width="170" height="26" rx="13" fill="#0D9488"/>
    <rect x="402" y="396" width="220" height="26" rx="13" fill="#4C5BFF" fill-opacity=".3"/>
    <rect x="402" y="462" width="190" height="26" rx="13" fill="#4C5BFF" fill-opacity=".3"/>
    <rect x="402" y="528" width="210" height="26" rx="13" fill="#4C5BFF" fill-opacity=".3"/>
    <rect x="402" y="594" width="140" height="26" rx="13" fill="#4C5BFF" fill-opacity=".3"/>
  </g>
</svg>
