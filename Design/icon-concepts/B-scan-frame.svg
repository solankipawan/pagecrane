<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept B · "Scan frame" — viewfinder corners + a page + the scan beam. Name-agnostic. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151A3A"/>
      <stop offset="1" stop-color="#2B2F8F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="corners" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#8A94FF"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- viewfinder corners -->
  <g fill="none" stroke="url(#corners)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 222 372 V 282 A 60 60 0 0 1 282 222 H 372"/>
    <path d="M 652 222 H 742 A 60 60 0 0 1 802 282 V 372"/>
    <path d="M 802 652 V 742 A 60 60 0 0 1 742 802 H 652"/>
    <path d="M 372 802 H 282 A 60 60 0 0 1 222 742 V 652"/>
  </g>

  <!-- page -->
  <g filter="url(#shadow)">
    <path d="M 408 322 H 560 L 640 402 V 666 A 36 36 0 0 1 604 702 H 408 A 36 36 0 0 1 372 666 V 358 A 36 36 0 0 1 408 322 Z" fill="#fff"/>
  </g>
  <path d="M 560 322 V 374 A 28 28 0 0 0 588 402 H 640 Z" fill="#C9D3FF"/>
  <rect x="412" y="440" width="150" height="20" rx="10" fill="#4C5BFF" fill-opacity=".85"/>
  <rect x="412" y="590" width="180" height="20" rx="10" fill="#4C5BFF" fill-opacity=".3"/>
  <rect x="412" y="634" width="130" height="20" rx="10" fill="#4C5BFF" fill-opacity=".3"/>

  <!-- scan beam -->
  <rect x="260" y="506" width="504" height="40" rx="20" fill="url(#beam)" filter="url(#blur)"/>
  <rect x="290" y="518" width="444" height="16" rx="8" fill="url(#beam)"/>
</svg>
