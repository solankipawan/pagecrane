<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android 13+ themed-icon layer: one colour (only alpha matters; the system tints it).
       Same page geometry as AppIcon-Pagecrane.svg. The fold is separated from the page by a cut-out
       gap so it still reads as a flap in a single colour; the back glass sheet is omitted. -->
